[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "counterpress-spatial-analysis"
version = "0.1.0"
description = "Spatial Predictors of Possession Regain and Transition Risk in Elite Soccer using StatsBomb 360"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Research Team"}
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "mplsoccer>=1.2.0",
    "scipy>=1.10.0",
    "shapely>=2.0.0",
    "requests>=2.31.0",
    "statsbombpy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]
